---
# Vagrant development inventory.
#
# Connection details are read from the environment that
# scripts/vagrant-inventory.sh writes to .vagrant/vagrant-env.sh; the defaults
# below only apply when that file has not been sourced.

all:
  children:
    vagrant:
      hosts:
        baseline:
          ansible_host: "{{ lookup('env', 'BASELINE_VAGRANT_HOST') | default('127.0.0.1', true) }}"
          ansible_port: "{{ lookup('env', 'BASELINE_VAGRANT_PORT') | default(22, true) }}"
          ansible_user: "{{ lookup('env', 'BASELINE_VAGRANT_USER') | default('vagrant', true) }}"
          ansible_ssh_private_key_file: >-
            {{ lookup('env', 'BASELINE_VAGRANT_KEY')
            | default('.vagrant/machines/main/libvirt/private_key', true) }}
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o UserKnownHostsFile=.vagrant/known_hosts
          -o LogLevel=ERROR
