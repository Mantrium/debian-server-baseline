---
# Produce the maintenance report: what an upgrade would do, which packages need
# attention, and whether a reboot or a service restart is pending.
#
# No package is upgraded and nothing is rebooted.

- name: Report the maintenance state
  hosts: all
  become: true
  gather_facts: true
  vars:
    baseline_maintenance_report_dir: /var/log/server-baseline
    baseline_maintenance_report: /var/log/server-baseline/maintenance-report.txt
    baseline_maintenance_critical_regex: "^Inst (linux-image|openssh|sudo|systemd|libc6|nftables)"
  roles:
    - preflight
  tasks:
    - name: Create the report directory
      ansible.builtin.file:
        path: "{{ baseline_maintenance_report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Refresh the APT package index
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    # The apt module cannot simulate an upgrade.
    - name: Simulate a distribution upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: apt-get -s dist-upgrade
      register: baseline_maintenance_upgrade
      changed_when: false

    - name: Collect the pending upgrades and the critical subset
      ansible.builtin.set_fact:
        baseline_maintenance_pending: >-
          {{ baseline_maintenance_upgrade.stdout_lines
             | select('search', '^Inst ') | list }}
        baseline_maintenance_critical: >-
          {{ baseline_maintenance_upgrade.stdout_lines
             | select('search', baseline_maintenance_critical_regex) | list }}

    - name: Check the security support status
      ansible.builtin.command:
        cmd: debian-security-support --check
      register: baseline_maintenance_security_support
      changed_when: false
      failed_when: false

    - name: Read the pending restart information
      ansible.builtin.command:
        cmd: needrestart -b
      register: baseline_maintenance_needrestart
      changed_when: false
      failed_when: false

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: baseline_maintenance_reboot

    - name: Write the maintenance report
      ansible.builtin.copy:
        content: |
          # Maintenance report for {{ server_hostname }}
          # Generated by debian-server-baseline (playbook: maintenance.yml) at {{ ansible_facts.date_time.iso8601 }}

          ## Pending upgrades
          {{ baseline_maintenance_pending | join('\n') }}

          ## Critical updates
          {{ baseline_maintenance_critical | join('\n') }}

          ## Security support
          {{ baseline_maintenance_security_support.stdout }}

          ## Pending service restarts
          {{ baseline_maintenance_needrestart.stdout }}

          ## Reboot required
          {{ 'yes' if baseline_maintenance_reboot.stat.exists else 'no' }}
        dest: "{{ baseline_maintenance_report }}"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    - name: Report the maintenance summary
      ansible.builtin.debug:
        msg: >-
          {{ baseline_maintenance_pending | length }} pending upgrades,
          {{ baseline_maintenance_critical | length }} critical;
          reboot required: {{ 'yes' if baseline_maintenance_reboot.stat.exists else 'no' }}
