---
# Produce the security audit report.
#
# This playbook changes nothing: it reads the target and writes a report.

- name: Report the security posture
  hosts: all
  become: true
  gather_facts: true
  vars:
    baseline_security_report: /var/log/server-baseline/security-audit.txt
  roles:
    - preflight
    - service_audit
    - kernel_status
  tasks:
    - name: Read the effective SSH configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: baseline_security_sshd
      changed_when: false

    - name: Read the firewall ruleset
      ansible.builtin.command:
        cmd: nft list ruleset
      register: baseline_security_nftables
      changed_when: false
      failed_when: false

    # The systemd module cannot query unit files.
    - name: Read the enabled unit files  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl list-unit-files --state=enabled --no-pager --plain
      register: baseline_security_units
      changed_when: false

    - name: Read the listening sockets
      ansible.builtin.command:
        cmd: ss -tulpn
      register: baseline_security_listeners
      changed_when: false

    - name: Check the security support status
      ansible.builtin.command:
        cmd: debian-security-support --check
      register: baseline_security_support
      changed_when: false
      failed_when: false

    - name: Read the running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: baseline_security_kernel
      changed_when: false

    - name: Write the security audit report
      ansible.builtin.copy:
        content: |
          # Security audit for {{ server_hostname }}
          # Generated by debian-server-baseline (playbook: security-audit.yml) at {{ ansible_facts.date_time.iso8601 }}

          ## SSH configuration
          {{ baseline_security_sshd.stdout }}

          ## Firewall ruleset
          {{ baseline_security_nftables.stdout }}

          ## Enabled unit files
          {{ baseline_security_units.stdout }}

          ## Listening sockets
          {{ baseline_security_listeners.stdout }}

          ## Security support
          {{ baseline_security_support.stdout }}

          ## Running kernel
          {{ baseline_security_kernel.stdout }}
        dest: "{{ baseline_security_report }}"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    - name: Report the security summary
      ansible.builtin.debug:
        msg: >-
          kernel {{ baseline_security_kernel.stdout }};
          {{ baseline_security_listeners.stdout_lines | length }} lines of listening sockets;
          firewall
          {{ 'active' if 'policy drop' in baseline_security_nftables.stdout else 'NOT ACTIVE' }}
