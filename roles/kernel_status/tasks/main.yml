---
# Report the running kernel, the installed kernel packages and whether a reboot
# or a service restart is pending.
#
# Nothing is installed, upgraded or rebooted.

- name: Create the report directory
  ansible.builtin.file:
    path: "{{ baseline_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Read the running kernel
  ansible.builtin.command:
    cmd: uname -r
  register: baseline_running_kernel
  changed_when: false

- name: List the installed kernel packages
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Package} ${Version}\n
      - linux-image-*
  register: baseline_kernel_packages
  changed_when: false
  failed_when: false

- name: Simulate a distribution upgrade  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: apt-get -s dist-upgrade
  register: baseline_dist_upgrade
  changed_when: false

- name: Read the pending restart information
  ansible.builtin.command:
    cmd: needrestart -b
  register: baseline_needrestart
  changed_when: false
  failed_when: false

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: baseline_reboot_required

- name: Write the kernel status report
  ansible.builtin.copy:
    content: |
      # Kernel status for {{ server_hostname }}
      # Generated by infra-server-baseline (role: kernel_status) at {{ ansible_facts.date_time.iso8601 }}

      ## Running kernel
      {{ baseline_running_kernel.stdout }}

      ## Installed kernel packages
      {{ baseline_kernel_packages.stdout }}

      ## Pending kernel upgrades
      {{ baseline_dist_upgrade.stdout_lines | select('search', '^Inst linux-image') | list | join('\n') }}

      ## Pending service restarts
      {{ baseline_needrestart.stdout }}

      ## Reboot required
      {{ 'yes' if baseline_reboot_required.stat.exists else 'no' }}
    dest: "{{ baseline_kernel_status_report }}"
    owner: root
    group: root
    mode: "0640"
  changed_when: false

- name: Report the kernel summary
  ansible.builtin.debug:
    msg: >-
      running kernel {{ baseline_running_kernel.stdout }};
      {{ baseline_dist_upgrade.stdout_lines | select('search', '^Inst linux-image') | list | length }}
      pending kernel upgrades;
      reboot required: {{ 'yes' if baseline_reboot_required.stat.exists else 'no' }}
