---
# Report the state of systemd services and listening sockets.
#
# This role never changes system state. It writes a report, so the report task
# is marked changed_when: false: a snapshot is not a configuration change, and
# the report is regenerated on every run.

- name: Create the report directory
  ansible.builtin.file:
    path: "{{ baseline_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Collect the running services
  ansible.builtin.command:
    cmd: systemctl --type=service --state=running --no-pager --plain
  register: baseline_running_services
  changed_when: false

- name: Collect the enabled unit files
  ansible.builtin.command:
    cmd: systemctl list-unit-files --state=enabled --no-pager --plain
  register: baseline_enabled_units
  changed_when: false

- name: Collect the failed units
  ansible.builtin.command:
    cmd: systemctl --failed --no-pager --plain
  register: baseline_failed_units
  changed_when: false

- name: Collect the listening sockets
  ansible.builtin.command:
    cmd: ss -tulpn
  register: baseline_listeners
  changed_when: false

- name: Write the service audit report
  ansible.builtin.copy:
    content: |
      # Service audit for {{ server_hostname }}
      # Generated by infra-server-baseline (role: service_audit) at {{ ansible_facts.date_time.iso8601 }}

      ## Running services
      {{ baseline_running_services.stdout }}

      ## Enabled unit files
      {{ baseline_enabled_units.stdout }}

      ## Failed units
      {{ baseline_failed_units.stdout }}

      ## Listening sockets
      {{ baseline_listeners.stdout }}
    dest: "{{ baseline_service_audit_report }}"
    owner: root
    group: root
    mode: "0640"
  changed_when: false

- name: Assert the expected services are running
  ansible.builtin.assert:
    that:
      - baseline_running_services.stdout is search(item)
    fail_msg: "Expected service '{{ item }}' is not running."
  loop: "{{ baseline_expected_services }}"
  loop_control:
    label: "{{ item }}"

- name: Assert the expected listeners are present
  ansible.builtin.assert:
    that:
      - baseline_listeners.stdout is search(item)
    fail_msg: "Expected listener '{{ item }}' is not present."
  loop: "{{ baseline_expected_listeners }}"
  loop_control:
    label: "{{ item }}"

- name: Report the service summary
  ansible.builtin.debug:
    msg: >-
      {{ baseline_running_services.stdout_lines | length }} lines of running
      services; failed units: {{ baseline_failed_units.stdout_lines | last }}
