---
# Report the block devices, filesystems and mount points.
#
# Nothing is partitioned, formatted or mounted.

- name: Create the report directory
  ansible.builtin.file:
    path: "{{ baseline_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Collect the block devices
  ansible.builtin.command:
    cmd: lsblk -f
  register: baseline_lsblk
  changed_when: false

- name: Collect the mount table
  ansible.builtin.command:
    cmd: findmnt
  register: baseline_findmnt
  changed_when: false

- name: Collect the filesystem usage
  ansible.builtin.command:
    cmd: df -hT
  register: baseline_df
  changed_when: false

- name: Collect the filesystem identifiers
  ansible.builtin.command:
    cmd: blkid
  register: baseline_blkid
  changed_when: false
  failed_when: false

- name: Collect the filesystems at or above the threshold
  ansible.builtin.shell:
    cmd: >-
      df -h --output=source,fstype,size,used,avail,pcent,target
      | awk 'NR == 1 || ($6 + 0) >= {{ baseline_storage_full_threshold }}'
  register: baseline_full_filesystems
  changed_when: false

- name: Write the storage report
  ansible.builtin.copy:
    content: |
      # Storage report for {{ server_hostname }}
      # Generated by debian-server-baseline (role: storage_checks) at {{ ansible_facts.date_time.iso8601 }}

      ## Block devices
      {{ baseline_lsblk.stdout }}

      ## Mount table
      {{ baseline_findmnt.stdout }}

      ## Filesystem usage
      {{ baseline_df.stdout }}

      ## Filesystem identifiers
      {{ baseline_blkid.stdout }}

      ## Filesystems at or above {{ baseline_storage_full_threshold }} percent
      {{ baseline_full_filesystems.stdout }}
    dest: "{{ baseline_storage_report }}"
    owner: root
    group: root
    mode: "0640"
  changed_when: false

- name: Report the storage summary
  ansible.builtin.debug:
    msg: >-
      {{ baseline_df.stdout_lines | length - 1 }} filesystems;
      at or above {{ baseline_storage_full_threshold }} percent:
      {{ baseline_full_filesystems.stdout_lines | length - 1 }}
